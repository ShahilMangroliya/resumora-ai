[project]
name = "resumora-ai"
version = "0.1.0"
description = "Resumora AI — an open-source resume/job-matching AI pipeline"
requires-python = ">=3.12"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/pipeline", "packages/training", "apps/api"]

[tool.uv.sources]
pipeline = { workspace = true }
training = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "honcho>=2.0",
    "reportlab>=4.0",
]

[tool.pytest.ini_options]
testpaths = ["apps", "packages"]
addopts = "--import-mode=importlib -m 'not integration'"
markers = [
    "integration: tests that require a live Ollama server (skipped by default; run with -m integration)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
