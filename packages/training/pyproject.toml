[project]
name = "training"
version = "0.1.0"
description = "ResumeFit training: synthetic data generation, gold set, HF Hub publishing"
requires-python = ">=3.12"
dependencies = [
    "pipeline",
    "httpx>=0.27",
    "pydantic>=2.0",
    "huggingface-hub>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/training"]
