[project]
name = "pipeline"
version = "0.1.0"
description = "ResumeFit pipeline library: ingestion, extraction, scoring, similarity, reasoning"
requires-python = ">=3.12"
dependencies = [
    "pypdf>=5.0",
    "python-docx>=1.1",
    "pydantic>=2.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline"]
