[project]
name = "training"
version = "0.1.0"
description = "ResumeFit training: synthetic data generation, gold set, HF Hub publishing"
requires-python = ">=3.12"
dependencies = [
    "pipeline",
    "httpx>=0.27",
    "pydantic>=2.0",
    "huggingface-hub>=0.24",
    "transformers>=4.44",
    "torch>=2.4",
    "peft>=0.12",
    "datasets>=2.20",
    "accelerate>=0.33",
    "mlflow>=2.16",
    "scikit-learn>=1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/training"]
